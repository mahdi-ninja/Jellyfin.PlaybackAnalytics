name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'manifest.json'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'manifest.json'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Checks
        run: ./scripts/check.sh

      - name: Build plugin package
        run: ./scripts/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: Jellyfin.PlaybackAnalytics-jf12
          path: dist/*.zip
          if-no-files-found: error
